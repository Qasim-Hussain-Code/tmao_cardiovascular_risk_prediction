name: tests

# The test suite is the only thing standing between a refactor and a silently
# wrong analysis, so it runs on every push and every pull request rather than
# on a schedule. A suite that is only run by hand stops being run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound is the minimum the package claims to support. The
        # upper bound catches deprecations in numpy and scikit-learn before
        # they become failures.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Run the analysis end to end
        # A passing test suite does not prove the pipeline runs. This step
        # exercises the whole path on simulated data and fails the build if
        # any stage raises.
        run: python scripts/run_analysis.py
